name: Pharma Morning Digest (DeepSeek)

# Generates the DeepSeek digest in the cloud, emails it, archives it to the repo,
# and publishes the browsable website to GitHub Pages — all without your laptop.
on:
  schedule:
    # GitHub cron is UTC. 05:00 UTC = 07:00 Rome (summer/CEST).
    # Mon–Fri: tight daily morning brief (24h window).
    - cron: "0 5 * * 1-5"
    # Saturday: "Week in Review" — deep 7-day retrospective.
    - cron: "0 5 * * 6"
    # Sunday: "Week Ahead" — forward-looking preview of the coming week's catalysts.
    - cron: "0 5 * * 0"
  workflow_dispatch:       # manual "Run workflow" button — lets you pick window + edition
    inputs:
      hours:
        description: "Look-back window in hours (24 = last day, 168 = week, 720 = ~month)"
        default: "24"
        required: false
      edition:
        description: "Edition"
        default: "morning"
        type: choice
        options: [morning, evening]

permissions:
  contents: write      # commit the archived digest back
  pages: write         # publish to GitHub Pages
  id-token: write

jobs:
  digest:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate and email the digest
        env:
          # Engine switch: a repo Variable (Settings → Variables), gemini|deepseek.
          # Unset → Gemini when GEMINI_API_KEY is present, else DeepSeek.
          PHARMA_ENGINE: ${{ vars.PHARMA_ENGINE }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          # Manual run: use the chosen inputs (daily mode). Scheduled run branches on weekday:
          #   Mon–Fri = tight daily brief · Saturday = Week in Review (7d) · Sunday = Week Ahead.
          HOURS="${{ github.event.inputs.hours }}"
          EDITION="${{ github.event.inputs.edition }}"
          MODE="daily"
          if [ -z "$HOURS" ]; then
            DOW="$(date -u +%u)"   # 1=Mon … 6=Sat, 7=Sun
            if [ "$DOW" = "6" ]; then HOURS=168; EDITION=evening; MODE=review
            elif [ "$DOW" = "7" ]; then HOURS=168; EDITION=evening; MODE=ahead
            else HOURS=24; EDITION=morning; MODE=daily; fi
          fi
          python3 deepseek/run_digest.py --email --telegram --hours "$HOURS" --edition "$EDITION" --mode "$MODE"

      - name: Archive the digest back to the repo
        run: |
          git config user.name "pharma-digest-bot"
          git config user.email "bot@users.noreply.github.com"
          git add digests/ pharma-news/catalysts.md
          # If a local push landed mid-run, rebase onto it; a genuinely failed push
          # must fail the job — a silently skipped push loses the digest forever
          # (the next day's site is rebuilt from whatever is in the repo).
          if git commit -m "Digest $(date -u +%F)"; then
            git pull --rebase origin main
            git push
          else
            echo "nothing to commit"
          fi

      - name: Build the website
        run: python3 site/build_site.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/public
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
