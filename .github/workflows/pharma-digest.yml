name: Pharma Morning Digest

# Generates the digest in the cloud (Gemini by default, DeepSeek fallback), emails it,
# archives it to the repo, and publishes the browsable website to GitHub Pages — all without
# your laptop.
on:
  schedule:
    # GitHub cron is UTC. 05:00 UTC = 07:00 Rome (summer/CEST).
    # Mon–Fri: tight daily morning brief (24h window).
    - cron: "30 3 * * 1-5"
    # Saturday: "Week in Review" (7-day) — the LAST Saturday of each month upgrades to
    # "Month in Review" (30-day), and the last Saturday of DECEMBER to "Year in Review"
    # (12-month). run_digest.py --auto picks which from the date.
    - cron: "30 3 * * 6"
    # Sunday: "Week Ahead" (coming week) — the LAST Sunday of each month upgrades to
    # "Month Ahead", and the last Sunday of DECEMBER to "Year Ahead" (coming 12 months).
    # run_digest.py --auto picks which from the date.
    - cron: "30 3 * * 0"
  workflow_dispatch:       # manual "Run workflow" button — lets you pick window + edition
    inputs:
      hours:
        description: "Look-back window in hours (24 = last day, 168 = week, 720 = ~month)"
        default: "24"
        required: false
      edition:
        description: "Edition"
        default: "morning"
        type: choice
        options: [morning, evening]
      mode:
        description: "Mode (daily / week|month|year in-review / week|month|year ahead)"
        default: "daily"
        type: choice
        options: [daily, review, ahead, month_review, month_ahead, year_review, year_ahead]

permissions:
  contents: write      # commit the archived digest back
  pages: write         # publish to GitHub Pages
  id-token: write

jobs:
  digest:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate the digest (delivery happens later)
        env:
          # Engine switch: a repo Variable (Settings → Variables), gemini|deepseek.
          # Unset → Gemini when GEMINI_API_KEY is present, else DeepSeek.
          PHARMA_ENGINE: ${{ vars.PHARMA_ENGINE }}
          # Cross-engine fallback is opt-in (off by default): a Gemini outage fails loudly
          # rather than silently spending on the paid engine. Toggle via the Command Centre.
          PHARMA_ENGINE_FALLBACK: ${{ vars.PHARMA_ENGINE_FALLBACK }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
          # Manual-run picks (empty on a scheduled run). --auto reads these; if IN_HOURS is
          # empty it derives the window/edition/mode from today's UTC weekday instead.
          # All that scheduling logic lives in run_digest.py (auto_schedule), not in shell.
          IN_HOURS: ${{ github.event.inputs.hours }}
          IN_EDITION: ${{ github.event.inputs.edition }}
          IN_MODE: ${{ github.event.inputs.mode }}
          # The dedicated "Build the website" step below rebuilds + deploys, so skip the
          # redundant in-process build (and its duplicate live market fetch) here.
          SKIP_SITE_BUILD: "1"
        # Generate + ground-check + finalize, but DON'T email/Telegram
        # yet. Delivery is a separate step AFTER archive + publish below, so a delivery
        # outage can never cost the day's archived digest or the published website.
        run: python3 engine/run_digest.py --auto

      - name: Archive the digest back to the repo
        run: |
          git config user.name "pharma-digest-bot"
          git config user.email "bot@users.noreply.github.com"
          git add digests/ pharma-news/catalysts.md pharma-news/state.json
          # If a local push landed mid-run, rebase onto it; a genuinely failed push
          # must fail the job — a silently skipped push loses the digest forever
          # (the next day's site is rebuilt from whatever is in the repo).
          if git commit -m "Digest $(date -u +%F)"; then
            git pull --rebase origin main
            git push
          else
            echo "nothing to commit"
          fi

      - name: Build the website
        run: python3 site/build_site.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/public
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Deliver (email + Telegram)
        # LAST on purpose: by here the brief is already archived to the repo AND published
        # to Pages, so even a sustained Resend/Telegram outage can't lose the day's digest.
        # Both senders run; the step (and job) fails if EITHER failed, so GitHub still
        # emails you about a delivery problem — just without sacrificing archive/publish.
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          rc=0
          python3 pharma-news/send_digest.py   || rc=1
          python3 pharma-news/send_telegram.py || rc=1
          exit $rc
